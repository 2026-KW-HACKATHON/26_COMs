<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 여백 없이 꽉 채운 정사각형: 안드로이드(마스커블)·iOS가 각자 모양으로 잘라 쓴다 -->
  <defs>
    <!-- 강조 그라데이션 (src/index.css의 .brand-gradient): 푸른 민트 → 에메랄드 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A0"/>
      <stop offset="0.55" stop-color="#0C9A6B"/>
      <stop offset="1" stop-color="#0A8A5F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 장소(핀) + 5초 영상(재생) -->
  <path fill="#fff" d="M256 104c-66.3 0-120 53.7-120 120 0 88 120 184 120 184s120-96 120-184c0-66.3-53.7-120-120-120z"/>
  <path fill="#0C9A6B" stroke="#0C9A6B" stroke-width="16" stroke-linejoin="round" d="M240 184 308 224 240 264z"/>
</svg>
